name: CI Release & Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Integration & Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: test_healthcare_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Dependencies
        run: |
          npm install
          cd server && npm install

      - name: Run Prisma Migration Deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/test_healthcare_db?schema=public"
        run: |
          npx prisma migrate deploy

      - name: Run Jest Test Suite with Coverage
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/test_healthcare_db?schema=public"
          JWT_SECRET: "ci_testing_super_secret_jwt_key_12345"
          NODE_ENV: "test"
          PORT: 5000
        run: |
          cd server && npm run test:coverage
